name: open_timeline
description: "A private diary for two, synced through a shared Google Drive folder."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.5

dependencies:
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.9.1
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
